[workspace]
members = ["crates/core", "crates/eval", "crates/search", "crates/engine", "crates/wasm"]
default-members = ["crates/engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/codewiththiha/gwaymaegyi"

[workspace.dependencies]
gwaymaegyi-core = { path = "crates/core" }
gwaymaegyi-eval = { path = "crates/eval" }
gwaymaegyi-search = { path = "crates/search" }
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = true
panic = "abort"
